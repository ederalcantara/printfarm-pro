services:
  - type: web
    name: sistema-legacy
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --worker-class gthread --timeout 120 public_wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-legacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://sistema-legacy.onrender.com

  - type: cron
    name: sistema-legacy-instagram-scheduler
    runtime: python
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python instagram_scheduler.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-legacy-db
          property: connectionString
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: APP_BASE_URL
        value: https://sistema-legacy.onrender.com

databases:
  - name: sistema-legacy-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
