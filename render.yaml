services:
  - type: web
    name: sistema-legacy
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-legacy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: sistema-legacy-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
