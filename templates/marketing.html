<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing · Sistema Legacy</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f5f6f8}.wrap{max-width:1150px;margin:auto;padding:28px}.card{border-radius:18px;border:1px solid #e6e8ed}.preview{aspect-ratio:1/1;background:linear-gradient(145deg,#111827,#312e81);color:white;border-radius:22px;padding:36px;display:flex;flex-direction:column;justify-content:space-between}.brand{font-weight:800;letter-spacing:.4px}.price{font-size:44px;font-weight:900}.small-note{font-size:13px}.copybox{white-space:pre-wrap}</style></head><body><div class="wrap"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2>Marketing / Instagram</h2><div class="text-secondary">Crie posts promocionais para @Legacy_3dstudio.</div></div><a class="btn btn-outline-dark" href="/">← Sistema Legacy</a></div><div class="row g-4"><div class="col-lg-5"><div class="card p-4"><h5>Montar post</h5><div class="mb-3"><label class="form-label">Peça do catálogo</label><select class="form-select" id="product">{% for p in products %}<option value="{{p.id}}" data-name="{{p.name|e}}" data-description="{{(p.description or '')|e}}" data-price="{{p.price}}" data-currency="{{p.currency}}">{{p.name}}</option>{% else %}<option value="">Cadastre uma peça no catálogo primeiro</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Chamada</label><input class="form-control" id="headline" value="Peça exclusiva em impressão 3D"></div><div class="row g-3"><div class="col-6"><label class="form-label">Preço promocional</label><input class="form-control" id="promoPrice" type="number" step="0.01"></div><div class="col-6"><label class="form-label">Texto do preço</label><input class="form-control" id="priceLabel" value="A partir de"></div></div><div class="mt-3"><label class="form-label">Mensagem curta</label><textarea class="form-control" id="message" rows="3">Produção sob encomenda. Escolha a quantidade e peça seu orçamento pelo link.</textarea></div><div class="mt-3"><label class="form-label">Hashtags</label><input class="form-control" id="hashtags" value="#impressao3d #3dprinting #personalizados #legacy3dstudio"></div><button class="btn btn-dark w-100 mt-4" onclick="buildPost()">Gerar post</button></div></div><div class="col-lg-7"><div class="preview" id="preview"><div><div class="brand">LEGACY 3D STUDIO</div><div class="small-note">@Legacy_3dstudio</div></div><div><div class="display-5 fw-bold" id="pvHeadline">Peça exclusiva em impressão 3D</div><div class="fs-3 mt-3" id="pvProduct">Produto Legacy</div><div class="mt-3" id="pvMessage">Produção sob encomenda.</div></div><div><div id="pvPriceLabel">A partir de</div><div class="price" id="pvPrice">$ 0.00</div><div class="small-note mt-2">Peça seu orçamento pelo link do perfil</div></div></div><div class="card p-4 mt-4"><div class="d-flex justify-content-between align-items-center"><h5 class="mb-0">Legenda pronta</h5><button class="btn btn-sm btn-outline-dark" onclick="copyCaption()">Copiar legenda</button></div><div class="copybox mt-3" id="caption"></div></div></div></div></div><script>const portal='https://sistema-legacy.onrender.com/request-quote';function money(v,c){const n=Number(v||0).toFixed(2);return c==='BRL'?'R$ '+n:'$ '+n}function buildPost(){const sel=document.getElementById('product');const opt=sel.options[sel.selectedIndex];if(!opt||!opt.dataset.name)return;const name=opt.dataset.name;const desc=opt.dataset.description||'';const base=opt.dataset.price||0;const cur=opt.dataset.currency||'USD';const promo=document.getElementById('promoPrice').value||base;const headline=document.getElementById('headline').value;const msg=document.getElementById('message').value;const hashtags=document.getElementById('hashtags').value;const label=document.getElementById('priceLabel').value;document.getElementById('pvHeadline').textContent=headline;document.getElementById('pvProduct').textContent=name;document.getElementById('pvMessage').textContent=msg;document.getElementById('pvPriceLabel').textContent=label;document.getElementById('pvPrice').textContent=money(promo,cur);document.getElementById('caption').textContent=`${headline}\n\n${name}\n${desc?desc+'\n':''}${label}: ${money(promo,cur)}\n\n${msg}\n\nPeça pelo link: ${portal}?product=${opt.value}#catalogo\n\n${hashtags}`;}async function copyCaption(){const text=document.getElementById('caption').textContent;await navigator.clipboard.writeText(text);alert('Legenda copiada.');}buildPost();</script></body></html>
