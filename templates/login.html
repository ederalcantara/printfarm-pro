<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sistema Legacy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#0b0d10,#1a1f27);display:grid;place-items:center;color:#fff}
    .card{width:min(430px,92vw);border:0;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    .brand{font-weight:800;letter-spacing:.5px}.accent{color:#7c3aed}
  </style>
</head>
<body>
  <div class="card bg-white text-dark p-4 p-md-5">
    <div class="mb-4"><div class="small text-uppercase text-secondary">Legacy 3D Studio</div><h1 class="brand mb-1">Sistema <span class="accent">Legacy</span></h1><p class="text-secondary mb-0">Gestão de produção, estoque e clientes.</p></div>
    {% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}{% endwith %}
    {% if setup_mode %}
      <h5 class="mb-3">Primeiro acesso</h5>
      <form method="post">
        <div class="mb-3"><label class="form-label">Seu nome</label><input class="form-control" name="full_name" required></div>
        <div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" name="username" autocomplete="username" required></div>
        <div class="mb-4"><label class="form-label">Senha</label><input class="form-control" name="password" type="password" minlength="8" required></div>
        <button class="btn btn-dark w-100 py-2">Criar administrador e entrar</button>
      </form>
    {% else %}
      <form method="post">
        <div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" name="username" autocomplete="username" required></div>
        <div class="mb-4"><label class="form-label">Senha</label><input class="form-control" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-dark w-100 py-2">Entrar</button>
      </form>
    {% endif %}
  </div>
</body>
</html>
