<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema Legacy</title><link rel="stylesheet" href="{{url_for('static',filename='legacy.css')}}"></head><body class="loginbody"><form class="login card" method="post"><div class="brand">LEGACY<span>3D</span></div><h1>Sistema Legacy</h1><p class="muted">Gestão de impressão 3D</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<label>Usuário<input name="username" required autofocus></label><label>Senha<input type="password" name="password" required></label><button class="btn primary">Entrar</button></form></body></html>
